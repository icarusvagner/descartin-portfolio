[package]
name = "portfolio"
version = "0.1.0"
edition = "2024"

[dependencies]
leptos = { version = "0.8", features = ["csr", "nightly"] }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }
leptos_dom = { version = "0.8" }
console_log = "1"
log = "0.4"
console_error_panic_hook = "0.1"

reqwasm = "0.5"
gloo-timers = { version = "0.3", features = ["futures"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }

chrono = { version = "0.4", features = ["serde"] }
percent-encoding = { version = "2" }
url = "2"

dotenv = "0.15"

thiserror = "2"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
tracing-subscriber-wasm = "0.1.0"

icondata = { version = "0.6" }
icondata_core = { version = "0.1" }
leptos_icons = { version = "0.6" }

leptos-use = { version = "0.16.0-beta2", features = ["storage", "use_event_listener", "on_click_outside", "use_window_focus"] }
leptos_query = { version = "0.5", features = ["csr"] }

[dev-dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3", features = ["Document", "Window", "MouseEvent"] }

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

